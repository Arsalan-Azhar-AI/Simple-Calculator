    <style>
        h1{
           
            background-color: antiquewhite;
            color: blue;

            display: inline;
            position: relative;

<body>
    <h1>My Calculator</h1>
    <div class="container">
        <div class="rows"><input class="input" type="text"></div>
        <div class="ls">
        <div class="rows">
            <button class="ac button">AC</button>
            <button class="w button">M+</button>
            <button class="w button">+</button>
        </div>
        <div class="rows">
            <button class="w button">7</button>
            <button class="w button">8</button>
            <button class="w button">9</button>
            <button class="w button">/</button>
        </div>
        <div class="rows">
            <button class="w button">4</button>
            <button class="wbutton">5</button>
            <button class="w button">6</button>
            <button class="w button">*</button>
        </div>
        <div class="rows">
            <button class="w button">1</button>
            <button class="w button">2</button>
            <button class="w button">3</button>
            <button class="w button">-</button>
        </div>
        <div class="rows">
            <button class="w button">0</button>
            <button class="w button">00</button>
            <button class="eq button">=</button>
        </div>
    </div>
    </div>
    <script src="index.js"></script>
